/* ═══ HERO ═══ */
.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px 80px;
  background: linear-gradient(170deg, var(--abyss) 0%, var(--deep) 25%, var(--ocean) 50%, var(--reef) 75%, var(--surface) 100%);
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 120% 60% at 50% 100%, rgba(61,186,232,0.25) 0%, transparent 70%),
    radial-gradient(ellipse 80% 40% at 20% 80%, rgba(46,204,113,0.08) 0%, transparent 60%);
  pointer-events: none;
}

.bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bubble {
  position: absolute;
  bottom: -40px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
  border: 1px solid rgba(255,255,255,0.15);
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0) scale(1); opacity: 0.7; }
  50%  { opacity: 0.5; }
  100% { transform: translateY(-110vh) scale(0.5); opacity: 0; }
}

.float-element {
  position: absolute;
  font-size: 2rem;
  animation: floatAround 8s ease-in-out infinite;
  opacity: 0.6;
  pointer-events: none;
}
@keyframes floatAround {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }

<!-- ═══════════════ RENDER SCRIPT ═══════════════ -->
<script>
(function() {
  // ── state ──
  let activeIndex = 0;
  let firstRender = true;

  // 切換活動時需要淡入過渡的容器
  const FADE_IDS = ['heroInfoGrid','infoCards','meetingPoints','timeline','notesGrid','checklist','contactBanner'];

  // ── Photo Album（與活動無關，一次渲染）──
  const pa = document.getElementById('photoAlbumSection');
  if (CONFIG.photoAlbum) {
    pa.innerHTML = `
      <a href="${CONFIG.photoAlbum}" target="_blank" rel="noopener" class="photo-banner fade-up" style="margin-top:28px;">
        <span class="pb-icon">📸</span>
        <div class="pb-text">
          <h3>活動照片</h3>
          <p>點擊查看或上傳本次活動照片</p>
        </div>
        <span class="pb-arrow">→</span>
      </a>
    `;
  }

  // ── Bubbles（一次渲染）──
  const bc = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = Math.random() * 24 + 6;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (Math.random() * 8 + 6) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    bc.appendChild(b);
  }

  // ── Scroll Fade Animations ──
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  function observeFadeUps() {
    document.querySelectorAll('.fade-up:not(.visible)').forEach(el => observer.observe(el));
  }

  // ── 活動分頁（activities > 1 場才顯示）──
  const tabBar = document.getElementById('tabBar');
  if (CONFIG.activities.length > 1) {
    tabBar.innerHTML = CONFIG.activities.map((a, i) =>
      `<button class="tab-btn" data-idx="${i}">${a.label}</button>`).join('');
    tabBar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => renderActivity(parseInt(btn.dataset.idx)));
    });
  } else {
    tabBar.style.display = 'none';
  }

  // ══════════════════════════════════════════════════
  //  依「活動」渲染整頁內容
  // ══════════════════════════════════════════════════
  function renderActivity(idx) {
    activeIndex = idx;
    const act = CONFIG.activities[idx];
    const site = DIVE_SITES[act.diveSite];
    if (!site) {
      document.body.innerHTML = '<h1 style="text-align:center;padding:80px 20px;">⚠️ 潛點「' + act.diveSite + '」不在資料庫中，請檢查 activities[' + idx + '].diveSite</h1>';
      return;
    }
    const isBoat = site.diveType === 'boat';

    // 分頁 active 狀態
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));

    // ── Hero ──
    const [aY, aM, aD] = (act.date || CONFIG.date).split('-');
    const dateStr = `${parseInt(aM)}/${parseInt(aD)}（${act.weekday || CONFIG.weekday}）`;
    document.getElementById('heroSubtitle').textContent = `📅 ${dateStr}｜${act.diveSite}`;
    const loadingHint = CONFIG.cwaApiKey ? ' <span style="opacity:0.5;font-size:0.65rem;">⏳</span>' : '';
    document.getElementById('heroInfoGrid').innerHTML = `
      <div class="hero-info-card"><div class="icon">🌡️</div><div class="label">地面氣溫</div><div class="value" id="heroAirTemp">${act.airTemp}${loadingHint}</div></div>
      <div class="hero-info-card"><div class="icon">🌊</div><div class="label">水溫</div><div class="value">${act.waterTemp}</div></div>
      <div class="hero-info-card"><div class="icon">⛅</div><div class="label">天氣</div><div class="value" id="heroWeather">${act.weather}${loadingHint}</div></div>
      <div class="hero-info-card"><div class="icon">🏊‍♂️</div><div class="label">潛水支數</div><div class="value">${act.diveCount} 支氣瓶</div></div>
    `;

    // ── Quick Info Cards ──
    const t = act.tide;
    // 潮汐：優先用 seq 陣列（可任意排序，如 乾→滿→乾），否則沿用舊的 high1/low/high2
    let tideValueHtml, tideNoteHtml;
    if (t.seq) {
      const high = t.seq.find(e => e.type.includes('滿'));
      const head = high || t.seq[0];
      tideValueHtml = `${head.t} ${head.type}`;
      tideNoteHtml = t.seq.map(e => `${e.t} ${e.type}`).join(' → ');
    } else {
      tideValueHtml = `${t.low} 乾潮`;
      tideNoteHtml = `${t.high1} 滿潮 → ${t.low} 乾潮<br>${t.high2} 滿潮`;
    }
    const waveNote = t.waveNote || '海況稍有起伏，請聽從導潛及教練指示';
    document.getElementById('infoCards').innerHTML = `
      <div class="info-card fade-up">
        <div class="card-icon">🌊</div>
        <div class="card-title">潮汐</div>
        <div class="card-value" id="tideValue">${tideValueHtml}</div>
        <div class="card-note" id="tideNote">${tideNoteHtml}</div>
      </div>
      <div class="info-card fade-up" style="transition-delay:0.1s">
        <div class="card-icon">📏</div>
        <div class="card-title">浪高</div>
        <div class="card-value" id="waveValue">${t.waveHeight}</div>
        <div class="card-note">${waveNote}</div>
      </div>
      <div class="info-card fade-up" style="transition-delay:0.2s">
        <div class="card-icon">📍</div>
        <div class="card-title">預計潛點</div>
        <div class="card-value">${act.diveSite}</div>
        <div class="card-note">視當日海況可能調整</div>
      </div>
    `;

    // ── Meeting Points（shuttle / selfDrive 為 null 就不渲染，direct 一律渲染；時間可被 act.meeting 覆蓋）──
    const meet = act.meeting || {};
    const shuttleTime  = (meet.shuttle   != null && site.shuttle)   ? meet.shuttle   : (site.shuttle   && site.shuttle.time);
    const selfTime     = (meet.selfDrive != null && site.selfDrive) ? meet.selfDrive : (site.selfDrive && site.selfDrive.time);
    const directTime   = (meet.direct    != null) ? meet.direct : site.direct.time;
    const selfAddr = site.selfDrive ? (site.selfDrive.address ? `<div class="address">📍 ${site.selfDrive.location}（${site.selfDrive.address}）</div>` : `<div class="address">📍 ${site.selfDrive.location}</div>`) : '';
    const selfTag = site.selfDrive && site.selfDrive.tag ? `<div class="point-tag">${site.selfDrive.tag}</div>` : '';
    const directWarning = site.warning ? `<div class="point-warning">⚠️ ${site.warning}</div>` : '';
    const shuttleCard = site.shuttle ? `
      <div class="point-card fade-up">
        <div class="point-time"><div class="time">${shuttleTime}</div><div class="period">AM</div></div>
        <div class="point-details">
          <h3>🚐 搭乘共乘車</h3>
          <p>搭乘 DIVIN'IN 共乘車的夥伴</p>
          <div class="address">📍 ${site.shuttle.location}</div>
          <div class="point-tag">共乘接駁</div>
          <br>
          <a href="${site.shuttle.mapUrl}" target="_blank" rel="noopener" class="map-btn">📍 開啟 Google Maps 導航</a>
        </div>
      </div>` : '';
    const selfCard = site.selfDrive ? `
      <div class="point-card fade-up">
        <div class="point-time"><div class="time">${selfTime}</div><div class="period">AM</div></div>
        <div class="point-details">
          <h3>🚗 自行前往海邊</h3>
          <p>自行開車或騎車前往，不知道潛點位置的夥伴</p>
          ${selfAddr}
          ${selfTag}
          <br>
          <a href="${site.selfDrive.mapUrl}" target="_blank" rel="noopener" class="map-btn">📍 開啟 Google Maps 導航</a>
        </div>
      </div>` : '';
    const directCard = `
      <div class="point-card fade-up">
        <div class="point-time"><div class="time">${directTime}</div><div class="period">AM</div></div>
        <div class="point-details">
          <h3>${isBoat ? '📍 集合地點' : '🏖️ 直接前往潛點'}</h3>
          <p>${isBoat ? '所有夥伴於此集合、上船出發' : '已知道潛點位置的老手夥伴'}</p>
          <div class="address">📍 ${site.direct.location}</div>
          <div class="point-tag">${isBoat ? '船潛集合' : '潛點集合'}</div>
          ${directWarning}
          <a href="${site.direct.mapUrl}" target="_blank" rel="noopener" class="map-btn">📍 開啟 Google Maps 導航</a>
        </div>
      </div>`;
    document.getElementById('meetingPoints').innerHTML = shuttleCard + selfCard + directCard;

    // ── Timeline（可被 act.schedule 覆蓋，否則用潛點預設）──
    const schedule = act.schedule || site.schedule;
    document.getElementById('timeline').innerHTML = schedule.map((item, i) => {
      const isDive = !!item.dive;
      const cls = isDive ? 'tl-item highlight fade-up' : 'tl-item fade-up';
      const badge = isDive ? `<div class="dive-badge">🫧 DIVE ${item.dive} · ~60 min</div>` : '';
      return `
        <div class="${cls}" style="transition-delay:${i * 0.05}s">
          <div class="tl-dot"><span class="dot-icon">${item.icon}</span></div>
          <div class="tl-content">
            <div class="tl-time">${item.time}</div>
            <div class="tl-title">${item.title}</div>
            <div class="tl-desc">${item.desc}</div>
            ${badge}
          </div>
        </div>
      `;
    }).join('');

    // ── Notes（依 diveType 切換）──
    const notes = isBoat ? [
      { icon: '⚠️', title: '高氧證照', cls: 'warning', html: '本次船潛使用高氧氣體（EANx），請務必確認潛水員自身具有<strong>高氧證照</strong>。' },
      { icon: '🚗', title: '停車資訊', html: '集合地點附近停車方便，抵達後可以和帶隊教練聯繫。' },
      { icon: '💊', title: '暈船提醒', html: '船程單趟 40 分鐘，兩潛結束後才會上岸。會暈船的夥伴請記得使用<strong>暈船藥</strong>。' },
      { icon: '☀️', title: '防曬與補水', id: 'noteWeather', html: '注意防曬並多喝水。潛水後搭船風大，建議攜帶薄外套擋風。' },
      { icon: '💰', title: '費用支付', html: '活動費用將於活動結束後收取，可使用<strong>轉帳</strong>方式支付。' },
      { icon: '📱', title: '保持聯繫', html: '活動當天請隨時<strong>保持手機暢通</strong>，以便聯繫與緊急狀況處理。' }
    ] : [
      { icon: '☀️', title: '防曬與補水', cls: 'warning', id: 'noteWeather', html: `天氣${act.weather}、氣溫約 ${act.airTemp}，請注意防曬並多喝水補充水分。` },
      { icon: '🧊', title: '水溫提醒', id: 'noteWaterTemp', html: `水溫${act.waterTemp}，${act.waterTempNote}。` },
      { icon: '💰', title: '費用支付', html: '活動費用將於活動結束後收取，可使用<strong>轉帳</strong>方式支付。' },
      { icon: '🚿', title: '盥洗說明', html: '現場備有可樂桶可簡單盥洗，盥洗完畢可直接返程。若想仔細盥洗，也可前往配合潛店使用熱水（備有有限車位）。' },
      { icon: '📱', title: '保持聯繫', html: '活動當天請隨時<strong>保持手機暢通</strong>，以便聯繫與緊急狀況處理。' },
      { icon: '🛢️', title: '氣瓶配送', html: '潛水氣瓶由 DIVIN\'IN 潛靜統一運送至潛點，結束後統一送回，不需自行處理。' }
    ];
    document.getElementById('notesGrid').innerHTML = notes.map(n => `
      <div class="note-card ${n.cls || ''} fade-up">
        <div class="note-icon">${n.icon}</div>
        <h3>${n.title}</h3>
        <p${n.id ? ` id="${n.id}"` : ''}>${n.html}</p>
      </div>`).join('');

    // ── Checklist（依 diveType 切換）──
    const gear = isBoat ? [
      '潛水證照（C 卡 + 高氧證照）', '面鏡 / 呼吸管', '防寒衣 / 背心', '蛙鞋 / 套鞋',
      '手套', '電腦錶', '潛水燈（必備）', '浮力袋（必備）',
      '飲用水 / 點心', '薄外套（船上擋風）', '暈船藥', '毛巾 / 換洗衣物'
    ] : [
      '潛水證照（C 卡）', '身分證 / 健保卡', '輕裝', '重裝', '電腦錶',
      '相機 / GoPro', '防曬用品', '飲用水 / 點心', '換洗衣物 / 毛巾'
    ];
    document.getElementById('checklist').innerHTML = gear.map(g =>
      `<div class="check-item"><span class="ci">✅</span> ${g}</div>`).join('');

    // ── Contact（支援單一 leader 或多位 leaders）──
    const leaders = act.leaders || (act.leader ? [act.leader] : []);
    const phoneBtns = leaders.map(l => `
        <a href="tel:${l.phone.replace(/-/g, '')}" class="contact-phone">
          <span class="phone-icon">📞</span>
          ${l.name}｜${l.phone}
        </a>`).join('');
    const anyLine = leaders.find(l => l.lineUrl);
    const lineBtn = anyLine ? `
        <a href="${anyLine.lineUrl}" target="_blank" rel="noopener" class="contact-line">
          <span class="line-icon">💬</span>
          ${anyLine.lineName || '潛靜小編'}
        </a>` : '';
    const namesTitle = leaders.map(l => l.name).join('、');
    document.getElementById('contactBanner').innerHTML = `
      <h3>${namesTitle}</h3>
      <div class="role">本次活動負責人 · DIVIN'IN 潛靜</div>
      <div class="contact-actions">
        ${phoneBtns}
        ${lineBtn}
      </div>
      <div class="contact-note">${lineBtn ? '點擊撥打電話，或加 LINE 向小編詢問' : '點擊即可撥打電話'}</div>
    `;

    // ── 顯示與淡入 ──
    if (firstRender) {
      firstRender = false;
      observeFadeUps();               // 首次載入：捲動時漸入
    } else {
      // 切換活動：整頁內容立即顯示 + 容器平滑淡入
      document.querySelectorAll('.fade-up:not(.visible)').forEach(el => el.classList.add('visible'));
      FADE_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = '0'; });
      requestAnimationFrame(() => requestAnimationFrame(() => {
        FADE_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = '1'; });
      }));
    }

    // ── CWA 氣象署自動抓取（依該活動的潛點）──
    if (CONFIG.cwaApiKey) {
      const stationInfo = WEATHER_MAP[act.diveSite] || { township: '瑞芳區', tideLocation: '新北市瑞芳區' };
      fetchWeatherData(stationInfo.township, act.date || CONFIG.date, idx);
      fetchTideData(stationInfo.tideLocation, act.date || CONFIG.date, idx);
    }
  }

  // ── 初次渲染 ──
  renderActivity(0);

  // ── 天氣 & 氣溫自動抓取 ──
  async function fetchWeatherData(township, targetDate, reqIdx) {
    try {
      // F-D0047-071：新北市未來1週鄉鎮天氣預報
      const url = 'https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-D0047-071'
        + '?Authorization=' + CONFIG.cwaApiKey
        + '&locationName=' + encodeURIComponent(township)
        + '&elementName=Wx,MinT,MaxT,PoP,WeatherDescription';

      console.info('🌤️ 天氣 API 請求：', township);
      const res = await fetch(url);
      if (!res.ok) throw new Error('天氣 API 回應 ' + res.status);
      const data = await res.json();
      console.log('🌤️ 天氣 API 原始回應：', JSON.stringify(data).substring(0, 500));

      // 解析回應結構
      const locations = data?.records?.locations;
      if (!locations || locations.length === 0) throw new Error('找不到地區資料');

      const loc = locations[0]?.location?.find(l => l.locationName === township);
      if (!loc) throw new Error('找不到 ' + township);

      let wx = '', minT = '', maxT = '', pop = '';

      for (const elem of loc.weatherElement) {
        // 找到涵蓋目標日期白天的時段
        const matchingTime = elem.time?.find(t => {
          const start = t.startTime?.substring(0, 10);
          const end = t.endTime?.substring(0, 10);
          // 優先匹配白天時段 (06:00-18:00)
          return (start === targetDate || end === targetDate)
            && t.startTime?.includes('06:00');
        }) || elem.time?.find(t => {
          // fallback：只要日期匹配就好
          return t.startTime?.substring(0, 10) === targetDate;
        });

        if (!matchingTime) continue;

        const val = matchingTime.elementValue?.[0]?.value
          || matchingTime.parameter?.parameterName
          || '';

        switch (elem.elementName) {
          case 'Wx':          wx = val; break;
          case 'MinT':        minT = val; break;
          case 'MaxT':        maxT = val; break;
          case 'PoP':         pop = val; break;
        }
      }

      // 若使用者已切換到別天，放棄這次（過期）的更新
      if (reqIdx !== activeIndex) return;

      // 更新頁面
      if (minT && maxT) {
        const tempStr = minT + ' – ' + maxT + '°C';
        const heroTemp = document.getElementById('heroAirTemp');
        if (heroTemp) heroTemp.innerHTML = tempStr;
        document.getElementById('noteWeather').innerHTML =
          '本週天氣（' + tempStr + '），務必做好防曬並多喝水補充水分。'
          + (pop && parseInt(pop) > 30 ? '降雨機率 ' + pop + '%，請隨身攜帶輕便雨具。' : '');
      }

      if (wx) {
        const heroWx = document.getElementById('heroWeather');
        if (heroWx) heroWx.innerHTML = wx;
      }

      console.info('✅ 天氣資料已從氣象署自動更新（' + township + '）');
    } catch (err) {
      console.warn('⚠️ 天氣 API 讀取失敗，使用手動資料：', err.message);
      if (reqIdx !== activeIndex) return;
      // 清除 loading 指示器，還原手動值
      const fallback = CONFIG.activities[reqIdx] || {};
      const heroTemp = document.getElementById('heroAirTemp');
      const heroWx = document.getElementById('heroWeather');
      if (heroTemp) heroTemp.textContent = fallback.airTemp || '';
      if (heroWx) heroWx.textContent = fallback.weather || '';
    }
  }

  // ── 潮汐自動抓取 ──
  async function fetchTideData(tideLocation, targetDate, reqIdx) {
    try {
      // F-A0021-001：未來1個月潮汐預報
      const url = 'https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-A0021-001'
        + '?Authorization=' + CONFIG.cwaApiKey
        + '&LocationName=' + encodeURIComponent(tideLocation);

      console.info('🌊 潮汐 API 請求：', tideLocation);
      const res = await fetch(url);
      if (!res.ok) throw new Error('潮汐 API 回應 ' + res.status);
      const data = await res.json();

      // 方便 debug：在 Console 印出完整回應結構
      console.log('🌊 潮汐 API 原始回應：', JSON.stringify(data).substring(0, 500));

      let tideEntries = [];

      // ── 解析策略：遍歷所有可能的回應結構 ──

      // 取得 location 資料（可能是 records.location 或 records.TideForecasts）
      const records = data?.records;
      if (!records) throw new Error('回應中沒有 records');

      // 路徑 A：records.location[].validTime[]
      if (records.location && Array.isArray(records.location)) {
        const loc = records.location[0];
        if (loc?.validTime) {
          for (const vt of loc.validTime) {
            if (vt.weatherElement) {
              for (const el of vt.weatherElement) {
                if (el.time) {
                  for (const t of el.time) {
                    const dt = t.dataTime || t.DateTime || '';
                    if (dt.startsWith(targetDate)) {
                      tideEntries.push({
                        type: t.parameter?.parameterName || '',
                        time: dt
                      });
                    }
                  }
                }
              }
            }
          }
        }
        // 路徑 A2：records.location[].time[] (直接在 location 下)
        if (tideEntries.length === 0 && loc?.time) {
          for (const t of loc.time) {
            const dt = t.dataTime || t.DateTime || '';
            if (dt.startsWith(targetDate)) {
              tideEntries.push({
                type: t.parameter?.parameterName || '',
                time: dt
              });
            }
          }
        }
      }

      // 路徑 B：records.TideForecasts[].Location.TimePeriods.Daily[]
      if (tideEntries.length === 0 && records.TideForecasts) {
        const tf = records.TideForecasts;
        // TideForecasts 多半是陣列，要先取第一筆，再往下進到 .Location 這一層
        const wrapper = Array.isArray(tf) ? tf[0] : tf;
        const loc = wrapper?.Location || wrapper?.location || wrapper;
        if (loc) {
          const periods = loc.TimePeriods || loc.timePeriods;
          const dailyList = periods?.Daily || periods?.daily || [];
          const dayArr = Array.isArray(dailyList) ? dailyList : [dailyList];
          for (const day of dayArr) {
            if ((day.Date || day.date || '').startsWith(targetDate)) {
              const times = day.Time || day.time || [];
              const timeArr = Array.isArray(times) ? times : [times];
              for (const t of timeArr) {
                tideEntries.push({
                  type: t.Tide || t.tide || '',
                  time: t.DateTime || t.dateTime || ''
                });
              }
              break;
            }
          }
        }
      }

      // 路徑 C：整個 records 就是 array
      if (tideEntries.length === 0 && Array.isArray(records)) {
        for (const item of records) {
          const dt = item.DateTime || item.dataTime || item.time || '';
          if (dt.startsWith(targetDate)) {
            tideEntries.push({
              type: item.Tide || item.type || item.parameter?.parameterName || '',
              time: dt
            });
          }
        }
      }

      console.log('🌊 解析到的潮汐資料：', tideEntries);

      if (tideEntries.length > 0) {
        // 若使用者已切換到別天，放棄這次（過期）的更新
        if (reqIdx !== activeIndex) return;

        const highs = tideEntries.filter(t => /滿潮|High|high/i.test(t.type));
        const lows = tideEntries.filter(t => /乾潮|Low|low/i.test(t.type));

        const fmtTime = (dt) => {
          if (!dt) return '--:--';
          const match = dt.match(/(\d{2}):(\d{2})/);
          return match ? match[0] : '--:--';
        };

        const h1 = highs[0] ? fmtTime(highs[0].time) : '--:--';
        const lo = lows[0] ? fmtTime(lows[0].time) : '--:--';
        const h2 = highs[1] ? fmtTime(highs[1].time) : '--:--';
        const lo2 = lows[1] ? fmtTime(lows[1].time) : '';

        const tv = document.getElementById('tideValue');
        const tn = document.getElementById('tideNote');
        if (tv) tv.textContent = lo + ' 乾潮';
        if (tn) tn.innerHTML = h1 + ' 滿潮 → ' + lo + ' 乾潮<br>' + h2 + ' 滿潮' + (lo2 ? ' → ' + lo2 + ' 乾潮' : '')
          + '<br><span style="font-size:0.7rem;color:var(--kelp);">✓ 氣象署自動更新（' + tideLocation + '）</span>';

        console.info('✅ 潮汐更新完成：滿潮 ' + h1 + '/' + h2 + '，乾潮 ' + lo + (lo2 ? '/' + lo2 : ''));
      } else {
        console.warn('⚠️ 找不到 ' + targetDate + ' 的潮汐資料');
        console.warn('💡 請打開 Console 查看上方「原始回應」來確認資料結構');
      }
    } catch (err) {
      console.warn('⚠️ 潮汐 API 讀取失敗，使用手動資料：', err.message);
    }
  }

})();
</script>
